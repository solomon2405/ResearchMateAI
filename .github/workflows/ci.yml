name: ResearchMate AI CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    env:
      SECRET_KEY: ci-testing-secret-key-not-for-production-deployment-purpose-12345
      DEBUG: "True"
      LLM_PROVIDER: "mock"
      RAG_SIMILARITY_THRESHOLD: "0.35"
      EMBEDDING_MODEL_NAME: "all-MiniLM-L6-v2"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django System Checks
        run: |
          python manage.py check

      - name: Verify Clean Migrations (No missing migration files)
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Automated Test Suite
        run: |
          python manage.py test --verbosity 2

      - name: Run Empirical RAG Benchmark Evaluation
        run: |
          python manage.py evaluate_rag
